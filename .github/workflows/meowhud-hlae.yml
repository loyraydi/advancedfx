# MeowHUD HLAE: собирает x64 AfxHookSource2.dll с mirv_meow_world (картинки в мире CS2)
# и кладёт её поверх официального HLAE той же версии. Результат — релиз
# "hlae-meowhud-<версия>.zip", его скачивает клиент MeowHUD (hlaeInstaller.ts).
#
# Обновление под новый HLAE: ветку meow-world перебазировать на новый тег advancedfx,
# запустить этот workflow с hlae_tag = новый тег.
name: MeowHUD HLAE

on:
  workflow_dispatch:
    inputs:
      hlae_tag:
        description: "Официальный релиз HLAE, поверх которого собираем (база ветки)"
        default: "v2.193.0"
  push:
    branches: [meow-world]

permissions:
  contents: write

env:
  HLAE_TAG: ${{ inputs.hlae_tag || 'v2.193.0' }}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Configure (x64 release)
        run: cmake --preset x64-release

      # Сборка шейдеров HLAE зовёт ShaderBuilder.exe и fxc.exe по имени — кладём их в PATH
      - name: ShaderBuilder + fxc в PATH
        shell: pwsh
        run: |
          cmake --build --preset x64-release --target shaderbuilder --parallel
          $sb = Get-ChildItem build/x64-release -Recurse -Filter ShaderBuilder.exe | Select-Object -First 1
          if (-not $sb) { throw "ShaderBuilder.exe not built" }
          $sb.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe | Where-Object { $_.DirectoryName -match "\\x64$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $fxc.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build AfxHookSource2
        run: cmake --build --preset x64-release --target AfxHookSource2 --parallel

      - name: Pack over official HLAE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download $env:HLAE_TAG -R advancedfx/advancedfx -p "hlae_*.zip" -D dl
          $zip = Get-ChildItem dl -Filter "hlae_*.zip" | Where-Object { $_.Name -notmatch "pdb" } | Select-Object -First 1
          if (-not $zip) { throw "official HLAE zip not found for $env:HLAE_TAG" }
          Expand-Archive $zip.FullName -DestinationPath out
          $dll = Get-ChildItem build/x64-release -Recurse -Filter AfxHookSource2.dll | Select-Object -First 1
          if (-not $dll) { throw "built AfxHookSource2.dll not found" }
          $target = Get-ChildItem out -Recurse -Filter AfxHookSource2.dll | Where-Object { $_.DirectoryName -match "x64$" } | Select-Object -First 1
          if (-not $target) { throw "x64/AfxHookSource2.dll not found in official zip" }
          Copy-Item $dll.FullName $target.FullName -Force
          $root = $target.Directory.Parent.FullName
          "MeowHUD HLAE $env:HLAE_TAG ($($env:GITHUB_SHA.Substring(0,7)))" | Out-File -Encoding utf8 (Join-Path $root "MEOWHUD-HLAE.txt")
          $ver = $env:HLAE_TAG.TrimStart('v')
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath "hlae-meowhud-$ver.zip"
          Get-FileHash "hlae-meowhud-$ver.zip" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: hlae-meowhud
          path: hlae-meowhud-*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meowhud-${{ env.HLAE_TAG }}-${{ github.run_number }}
          name: MeowHUD HLAE ${{ env.HLAE_TAG }} (build ${{ github.run_number }})
          files: hlae-meowhud-*.zip
          make_latest: true
